name: Update GitHub Status HUD

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate HUD
        run: python .github/scripts/hud.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config --local user.email "lucasaosf@gmail.com"
          git config --local user.name "Lucas Aøsf"
          git add assets/hud.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(status): update GitHub status HUD" && git push)
